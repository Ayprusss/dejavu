name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, dejavu]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Check formatting
        run: npm run format:check

      # scripts/deploy/*.sh (7.4) are plain bash, not part of either npm
      # workspace, and shellcheck isn't installed on the runner - Docker is
      # the same way 6.4 runs actionlint. This only needs to run once, not
      # once per matrix leg, so it's pinned to a single workspace and
      # overrides the matrix's working-directory back to the repo root.
      - name: Shellcheck scripts/deploy
        if: matrix.workspace == 'backend'
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            scripts/deploy/*.sh \
            scripts/deploy/test/run.sh \
            scripts/deploy/test/fake-bin/aws \
            scripts/deploy/test/fake-bin/curl

  test-backend:
    name: test-backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # No secrets required: tests/setup.js supplies fake values for every
      # variable src/config/env.js validates at boot.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dejavu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dejavu/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: dejavu/coverage/
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dejavu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dejavu/package-lock.json

      - run: npm ci

      # VITE_API_URL is inlined at build time, so this only proves the bundle
      # compiles — it is not the artifact that gets deployed.
      - run: npm run build

  boot-check:
    name: boot-check (fail-fast config)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Phase 0's guarantee, asserted in CI rather than argued for: the app must
      # refuse to start when JWT_SECRET is absent.
      - name: App refuses to boot without JWT_SECRET
        run: |
          set +e
          output=$(DATABASE_URL=postgres://x/x \
                   STRIPE_SECRET_KEY=x STRIPE_WEBHOOK_SECRET=x \
                   node -e "require('./src/app')" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::App booted without JWT_SECRET set"
            exit 1
          fi
          echo "$output" | grep -q "JWT_SECRET" || {
            echo "::error::Boot failed, but not for the expected reason"
            exit 1
          }
          echo "OK: refused to boot, and named JWT_SECRET"

      - name: App boots when every required variable is present
        run: |
          DATABASE_URL=postgres://dejavu:dejavu@localhost:5432/dejavu \
          JWT_SECRET=a-test-secret-that-is-at-least-32-chars \
          STRIPE_SECRET_KEY=sk_test_x STRIPE_WEBHOOK_SECRET=whsec_x \
          node -e "require('./src/app'); console.log('OK: booted')"

  migrations:
    name: migrations (up / down / up)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same image as docker-compose and, in Phase 6, the same major version as
    # RDS. Local, CI and production run one set of migrations or the exercise
    # is pointless.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dejavu
          POSTGRES_PASSWORD: dejavu
          POSTGRES_DB: dejavu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dejavu -d dejavu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dejavu:dejavu@localhost:5432/dejavu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Migrate up
        run: npx node-pg-migrate up

      # The reason to run down at all: a migration whose down is wrong is only
      # discovered when you need it, which is the worst possible moment. Going
      # all the way to zero and back up again proves both directions and proves
      # the up path is repeatable on a clean database.
      - name: Migrate all the way down
        run: npx node-pg-migrate down 0

      - name: Migrate up again
        run: npx node-pg-migrate up

      - name: Assert the schema landed
        run: |
          npx node -e "
          const { Client } = require('pg');
          const expected = ['Order','OrderItem','Product','ProductVariant','StripeEvent','User'];
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const { rows } = await client.query(
              \"SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename\"
            );
            const actual = rows.map((r) => r.tablename);
            const missing = expected.filter((t) => !actual.includes(t));
            if (missing.length) {
              console.error('Missing tables:', missing.join(', '), '| got:', actual.join(', '));
              process.exit(1);
            }
            if (actual.includes('_prisma_migrations')) {
              console.error('_prisma_migrations should not exist');
              process.exit(1);
            }
            console.log('OK: schema present -', actual.join(', '));
            await client.end();
          })();
          "

  test-integration:
    name: test-integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dejavu
          POSTGRES_PASSWORD: dejavu
          POSTGRES_DB: dejavu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dejavu -d dejavu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite TRUNCATEs every table between tests, so it gets its own
      # database. globalSetup refuses to run against a non-local host.
      DATABASE_URL: postgres://dejavu:dejavu@localhost:5432/dejavu_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # No Stripe or Supabase credentials: tests/integration/setup.js supplies
      # fakes, webhook payloads are signed locally with a test secret, and the
      # only Stripe network call is stubbed. Migrations are applied by the
      # suite's own globalSetup, from the same files the `migrations` job runs.
      - name: Run integration tests
        run: npm run test:integration

  image:
    name: image (${{ matrix.target }})
    # Native arm64 — D2's whole point is avoiding QEMU emulation, and this
    # runner is free for public repos.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [api, migrator]
    # No AWS credentials here on purpose: this job proves the image builds
    # and passes the CVE gate on every PR, including from a fork. Pushing the
    # result to ECR needs the push role from 6.5 and runs only on `main`,
    # once an image already exists there for a Lambda to reference (6.7).
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: ${{ matrix.target }}
          platforms: linux/arm64
          load: true
          tags: dejavu-${{ matrix.target }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # Pinned by commit SHA, not tag — a tag is a mutable pointer, the same
      # argument as never deploying `:latest`. This is the first action in
      # the repo pinned this way; the rest of ci.yml still uses tags.
      - name: Scan ${{ matrix.target }} for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dejavu-${{ matrix.target }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          # A CVE with no available fix would block every PR on something no
          # PR can change, which trains people to ignore the gate instead of
          # trusting it. backend/.trivyignore is the explicit, reviewed
          # exception list for the rest — each entry carries a reason and a
          # date.
          ignore-unfixed: true
          trivyignores: backend/.trivyignore

  # Pushes the image `image` just built and scanned to ECR, tagged by SHA.
  # Runs only on `main`, after an image already exists there for envs/dev's
  # Lambda to reference (6.7) — a PR, including from a fork, never gets AWS
  # credentials.
  push-image:
    name: push-image (${{ matrix.target }})
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [api, migrator]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # No access keys. This exchanges the job OIDC token for credentials
      # that expire in an hour, same as terraform.yml's plan/apply roles.
      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dejavu-push-${{ matrix.target }}-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Rebuilds from the same GHA cache the `image` job just populated
      # (same scope), so this is a cache hit, not a second real build - the
      # thing that actually changes is `push: true` and the destination tag.
      - name: Push ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.target == 'api' && vars.ECR_API_REPO || vars.ECR_MIGRATOR_REPO }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          # Buildx attaches a provenance/SBOM attestation by default, which
          # turns a single-arch push into an OCI image index. Lambda rejects
          # that outright ("image manifest ... media type ... not
          # supported") - found in 6.7 against a real CreateFunction call.
          provenance: false
          sbom: false

  # Aggregate gate: this is the single check to require in branch protection,
  # so adding a job above does not mean editing the protection rule.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        test-backend,
        test-frontend,
        build-frontend,
        boot-check,
        migrations,
        test-integration,
        image,
        push-image,
      ]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "test-backend:   ${{ needs.test-backend.result }}"
          echo "test-frontend:  ${{ needs.test-frontend.result }}"
          echo "build-frontend: ${{ needs.build-frontend.result }}"
          echo "boot-check:     ${{ needs.boot-check.result }}"
          echo "migrations:     ${{ needs.migrations.result }}"
          echo "integration:    ${{ needs.test-integration.result }}"
          echo "image:          ${{ needs.image.result }}"
          echo "push-image:     ${{ needs.push-image.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
