name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` is what lets a job ask GitHub for an OIDC token. It is not
# granted to workflow runs from forked pull requests, which is why a fork
# cannot reach this account no matter what it puts in a workflow file.
permissions:
  contents: read

env:
  TF_VERSION: '1.11.4'
  TF_IN_AUTOMATION: 'true'

jobs:
  # --------------------------------------------------------------------------
  # Formatting and validation. No credentials, so this also runs for forks.
  # --------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      # `-backend=false` checks syntax and provider schemas without needing the
      # state bucket, so this job stays credential-free.
      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # --------------------------------------------------------------------------
  # Plan on every PR, with the read-only role. Result posted as a comment.
  # --------------------------------------------------------------------------
  plan:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # No access keys. This exchanges the job OIDC token for credentials that
      # expire in an hour.
      - name: Assume the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && vars.AWS_PLAN_ROLE_ARN_PROD || vars.AWS_PLAN_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dejavu-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        id: plan
        working-directory: terraform/envs/${{ matrix.environment }}
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat plan.txt

      - name: Comment the plan on the PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const path = `terraform/envs/${process.env.ENVIRONMENT}/plan.txt`;
            const raw = fs.readFileSync(path, 'utf8');

            // A GitHub comment caps at 65536 characters; keep the tail, which
            // is where the summary line lives.
            const body = raw.length > 60000
              ? '...(truncated)...\n' + raw.slice(-60000)
              : raw;

            const marker = `<!-- tf-plan-${process.env.ENVIRONMENT} -->`;
            const heading = `### Terraform plan - \`${process.env.ENVIRONMENT}\``;
            const text = [
              marker,
              heading,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              body,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body: text,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body: text,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  # --------------------------------------------------------------------------
  # Apply. `environment:` is what puts environment:<name> into the OIDC token -
  # the claim the apply role trust policy requires - and it is also what makes
  # GitHub run that environment protection rules first. One keyword does both
  # jobs, which is why the trust policy is scoped to it rather than to a ref.
  # --------------------------------------------------------------------------
  apply-dev:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dejavu-apply-dev-${{ github.run_id }}

      - name: terraform init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform apply
        working-directory: terraform/envs/dev
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false

  apply-prod:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest

    # The protected one. A required reviewer here is the only thing standing
    # between a workflow run and production, because the OIDC token does not
    # carry environment:production until that approval is given.
    environment: production

    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: dejavu-apply-prod-${{ github.run_id }}

      - name: terraform init
        working-directory: terraform/envs/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform apply
        working-directory: terraform/envs/prod
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false
